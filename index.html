
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Form</title>

    <style>
       body {
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #00feba, #5b548a);
}

        .form-container {
            width: 400px;
            margin: 50px auto;
            padding: 25px;
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
        }

        h2 {
            text-align: center;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            width: 100%;
            padding: 10px;
            background-color: #333;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: #555;
        }
    </style>
</head>

<body>

    <div class="form-container">

        <h2>Student Information</h2>

        <form action="https://formspree.io/f/xdekvpkr" method="post">

            <label for="name">Name</label>
            <input name="name" id="name" type="text">

            <label for="college">College</label>
            <input name="college" id="college" type="text">

            <label for="ssc_result">SSC Result</label>
            <input name="ssc_result" id="ssc_result" type="number"
                   step="0.01" min="0" max="5">

            <label for="number">Mobile Number</label>
            <input name="number" id="number" type="tel">

            <label for="guardian_number">Guardian Number</label>
            <input name="guardian_number" id="guardian_number" type="tel">

            <label for="address">Address</label>
            <input name="address" id="address" type="text">

            <label for="email">Your Email</label>
            <input name="email" id="email" type="email">

            <button type="submit">Submit</button>

        </form>

    </div>

</body>

</html>
```

<!-- এখানে একটা গুরুত্বপূর্ণ correction করেছি:

তোমার code-এ **Mobile Number** আর **Guardian Number** দুটোর `id` এবং `name` একই ছিল:

```html
name="number" id="number"
```

আমি Guardian-এর জন্য আলাদা করেছি:

```html
name="guardian_number" id="guardian_number"
```

এতে Formspree-তে দুইটা number আলাদাভাবে পাওয়া যাবে। -->
